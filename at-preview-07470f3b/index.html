<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Private preview</title>
<style>
:root{--bg:#f6f7f9;--ink:#14202e;--muted:#4a5a6c;--rule:#dfe4ea;--accent:#1f5a9e}
@media (prefers-color-scheme:dark){:root{--bg:#0d141c;--ink:#e7edf3;--muted:#9db0c3;--rule:#233243;--accent:#2a6bb6}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px}
form{display:grid;gap:.8rem;width:min(22rem,100%)}
input,button{font:inherit;padding:.7rem .9rem;border-radius:10px;border:1px solid var(--rule);background:transparent;color:inherit}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
p{margin:0;color:var(--muted);font-size:.9rem}
</style></head><body>
<form id="f"><h1 style="margin:0;font-size:1.3rem">Private preview</h1>
<p>This page is not public yet. Enter the password to view it.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
<button>Open</button><p id="msg" role="status"></p></form>
<script>
const SALT = "YUwsD0jd9a1Y/jKGVerDsg==", ITER = 250000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256"}, base, 256));
}
async function open(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const buf = new Uint8Array(await (await fetch("page.enc")).arrayBuffer());
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12)}, key, buf.slice(12)));
  try { sessionStorage.setItem("pk", btoa(String.fromCharCode(...raw))); } catch (e) {}
  window.__PK = raw;
  document.open(); document.write(html); document.close();
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); const msg = document.getElementById("msg"); msg.textContent = "Opening…";
  try { await open(await derive(document.getElementById("pw").value)); }
  catch (err) { msg.textContent = "Wrong password."; }
};
try { const k = sessionStorage.getItem("pk"); if (k) open(b64(k)).catch(() => sessionStorage.removeItem("pk")); } catch (e) {}
</script></body></html>
